[package]
name = "dumbdns-rs"
version = "0.1.0"
edition = "2021"
description = "DumbDNS rewritten in Rust — LLM client in a DNS server (TXT queries for prompts)"
license = "MIT"

[[bin]]
name = "dumbdns"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-server = { version = "0.24", features = ["dns-over-rustls", "dns-over-https-rustls", "dns-over-quic"] }
hickory-proto = { version = "0.24", features = ["dns-over-rustls", "dns-over-https-rustls", "dns-over-quic", "dnssec-ring"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
base32 = "0.4"
prometheus = "0.13"
async-trait = "0.1.92"
rand = "0.10.3"
rcgen = "0.14.10"
rustls-pemfile = "2.2.0"
rustls = "0.21"
ring = "0.17.14"
base64 = "0.23.1"
governor = "0.10.4"
toml = "1.1.8"
lru = "0.19.0"
regex = "1.13.1"
async-openai = { version = "0.42.2", features = ["chat-completion", "embedding"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
hickory-resolver = "0.24"
hickory-proto = "0.24"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
reqwest = { version = "0.12", features = ["rustls-tls"] }
